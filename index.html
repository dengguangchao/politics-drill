<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>政治理论排坑练习</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="seal">排坑</span>
    <span class="brand-name">政治理论排坑练习</span>
  </div>
  <nav class="tabs">
    <button class="tab is-on" data-go="setup">开始练习</button>
    <button class="tab" data-go="review">错题与收藏</button>
    <button class="tab" data-go="browse">通读手册</button>
    <button class="tab" data-go="stats">学习进度</button>
  </nav>
</header>

<main>

<!-- ========== 配置页 ========== -->
<section id="view-setup" class="view is-on">
  <div class="setup-grid">
    <div class="col-main">
      <h1 class="page-title">今天练哪一块</h1>
      <p class="lead">题库共 <b id="bank-count">0</b> 条表述，全部来自手册里的“主角关键词”排坑训练。勾选范围，选一种练法，直接开始。</p>

      <h2 class="block-title">练习范围</h2>
      <div class="range-tools">
        <button class="mini" data-sel="all">全选</button>
        <button class="mini" data-sel="none">清空</button>
        <button class="mini" data-sel="xi">只选习思想</button>
        <button class="mini" data-sel="ma">只选马原</button>
        <button class="mini" data-sel="weak">只选薄弱章节</button>
      </div>
      <div id="section-list" class="section-list"></div>
    </div>

    <aside class="col-side">
      <h2 class="block-title">练法</h2>
      <div class="modes" id="mode-list">
        <label class="mode is-on"><input type="radio" name="mode" value="judge" checked>
          <b>判断改错</b><span>读原句判对错，错的当场看红笔批改。最贴近考场。</span></label>
        <label class="mode"><input type="radio" name="mode" value="choice">
          <b>关键词四选一</b><span>句子挖掉主角关键词，从四个近似选项里选回来。</span></label>
        <label class="mode"><input type="radio" name="mode" value="cloze">
          <b>默写填空</b><span>把关键词打出来，拼写记不牢的地方一次暴露。</span></label>
        <label class="mode"><input type="radio" name="mode" value="flash">
          <b>闪卡速记</b><span>关键词全部盖住，先自己背，再翻面对答案。</span></label>
      </div>

      <h2 class="block-title">这一轮</h2>
      <div class="opts">
        <label class="opt"><span>题量</span>
          <select id="opt-size">
            <option value="20">20 题</option>
            <option value="30" selected>30 题</option>
            <option value="50">50 题</option>
            <option value="0">全部</option>
          </select>
        </label>
        <label class="opt"><span>顺序</span>
          <select id="opt-order">
            <option value="shuffle" selected>打乱</option>
            <option value="book">按手册顺序</option>
            <option value="weak">错得多的排前面</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="opt-onlywrong"> 只抽我做错过的题</label>
        <label class="check"><input type="checkbox" id="opt-variant"> 判断题加入变式：正确表述也可能被换掉一个词</label>
      </div>

      <button id="start" class="primary">开始练习</button>
      <p class="side-note" id="pick-note">已选 0 题</p>
    </aside>
  </div>
</section>

<!-- ========== 答题页 ========== -->
<section id="view-drill" class="view">
  <div class="drill-head">
    <button class="ghost" data-go="setup">← 结束本轮</button>
    <div class="progress">
      <div class="bar"><i id="bar-fill"></i></div>
      <span id="progress-text">0 / 0</span>
    </div>
    <div class="score"><b id="score-right">0</b> 对 · <b id="score-wrong">0</b> 错</div>
  </div>

  <article class="card" id="card">
    <div class="card-meta"><span id="q-source"></span></div>
    <div class="stem" id="q-stem"></div>
    <div class="answer-area" id="q-answer"></div>
    <div class="feedback" id="q-feedback" hidden></div>
  </article>

  <div class="card-foot">
    <button class="ghost" id="btn-star">☆ 收藏</button>
    <span class="hint" id="q-hint"></span>
    <button class="primary" id="btn-next" hidden>下一题</button>
  </div>
</section>

<!-- ========== 错题与收藏 ========== -->
<section id="view-review" class="view">
  <h1 class="page-title">错题与收藏</h1>
  <div class="review-tools">
    <button class="mini is-on" data-rev="wrong">错题本 <b id="cnt-wrong">0</b></button>
    <button class="mini" data-rev="star">收藏 <b id="cnt-star">0</b></button>
    <button class="primary small" id="drill-review">练这些题</button>
    <button class="ghost small" id="clear-review">清空当前列表</button>
  </div>
  <div id="review-list" class="review-list"></div>
</section>

<!-- ========== 通读手册 ========== -->
<section id="view-browse" class="view">
  <h1 class="page-title">通读手册</h1>
  <p class="lead">正确表述整篇对照，红字是原手册挖的坑。点“盖住关键词”可以边读边自测。</p>
  <div class="range-tools">
    <button class="mini" id="toggle-mask">盖住关键词</button>
    <select id="browse-filter"></select>
  </div>
  <div id="browse-list" class="browse-list"></div>
</section>

<!-- ========== 学习进度 ========== -->
<section id="view-stats" class="view">
  <h1 class="page-title">学习进度</h1>
  <div class="stat-cards" id="stat-cards"></div>
  <h2 class="block-title">各章掌握情况</h2>
  <div id="stat-table" class="stat-table"></div>
  <button class="ghost small" id="reset-all">清空全部学习记录</button>
</section>

</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
